:root {

  /* --- Tipografias -------------------------------------------------
     Para poner la fuente del titulo: anadir su @font-face o el <link>
     de Google Fonts en el <head> y cambiar SOLO esta variable.       */
  --fuente-titulo:   Georgia, "Times New Roman", serif;   /* nombre + subtitulo */
  --fuente-texto:    system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --fuente-obra:     "Cormorant Garamond", Georgia, serif;   /* titulos de las obras (cursiva) */

  /* Tamanos (se adaptan solos entre movil y escritorio) */
  --tam-titulo:       clamp(2.1rem, 11vw, 3.4rem);
  --tam-subtitulo:    clamp(0.95rem, 4vw, 1.15rem);
  --tam-texto:        1rem;
  --grosor-titulo:    400;
  --espaciado-titulo: 0.02em;   /* separacion entre letras del nombre */

  /* --- Colores -----------------------------------------------------
     Fondo general de la pagina                                       */
  --color-fondo:            #f5f7f9;
  /* Texto normal (bio, titulos de obra, contacto) */
  --color-texto:            #2b2a28;
  /* Texto secundario (subtitulo, ano, tecnica) */
  --color-texto-suave:      #6f6c67;
  /* Nombre de la artista */
  --color-titulo:           #4398CE;

  /* Barra de navegacion */
  --color-barra-fondo:      #faf9f7;
  --color-barra-texto:      #6f6c67;
  --color-barra-activo:     #2b2a28;   /* enlace de la seccion visible */
  --color-barra-borde:      #e2ded7;   /* linea inferior de la barra   */

  /* Cuadro de la bio
     Tono a medio camino entre el fondo de la pagina y un azul grisaceo:
     marca que ahi hay un cuadro de texto, pero sin llamar la atencion.
     El fondo se monta con dos piezas para tocar color y transparencia
     por separado:
       --color-caja-tinte   = el color, en R,G,B (225,233,238 es #E1E9EE)
       --caja-transparencia = cuanto se ve (0 = invisible, 1 = color solido) */
  --color-caja-tinte:       225, 233, 238;
  --caja-transparencia:     .75;
  --color-caja-fondo:       rgba(var(--color-caja-tinte), var(--caja-transparencia));
  --color-caja-borde:       #2b2a28;   /* solo se usa si se vuelve a poner borde */
  --grosor-caja-borde:      0;         /* 0 = sin borde; 1px lo devuelve         */
  --caja-redondeo:          22px;      /* puntas redondeadas; 0 = esquinas rectas */

  /* Obras (mientras no haya fotos se ve este gris) */
  --color-obra-fondo:       #e6e3de;
  --color-obra-borde:       #2b2a28;
  --grosor-obra-borde:      1px;

  /* Separadores de puntos */
  --color-puntos:           #9b968e;
  --color-rayuela:          var(--color-titulo);   /* rayuelas entre grupos */
  --tam-punto:              2px;    /* grosor del punto        */
  --separacion-puntos:      9px;    /* distancia entre puntos  */

  /* Enlaces de contacto */
  --color-enlace:           #2b2a28;

  /* Lightbox (ampliacion de la obra) */
  --color-lightbox-fondo:   rgba(20, 19, 18, 0.92);
  --color-lightbox-texto:   #faf9f7;

  /* --- Medidas ----------------------------------------------------- */
  --ancho-maximo:     980px;   /* ancho maximo del contenido en pantalla grande */
  --margen-lateral:   22px;    /* aire a izquierda y derecha */
  --alto-mosaico:     75px;    /* alto de partida de cada fila del mosaico */
  --alto-max-obra:    200px;   /* tope: grupos de 1-2 obras no salen enormes */
  --hueco-mosaico:    14px;    /* separacion entre obras */
  --aire-malla:       clamp(22px, 6vw, 36px);    /* aire encima y debajo de cada rayuela */
  --tam-rayuela:      30px;    /* lado de cada casilla de la rayuela */
  --alto-barra:       52px;
}


/* ============================================================
   2. BASE
   ============================================================ */
* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  /* para que la barra fija no tape el inicio de la seccion al saltar */
  scroll-padding-top: calc(var(--alto-barra) + env(safe-area-inset-top, 0px) + 12px);
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

body {
  margin: 0;
  background: var(--color-fondo);
  color: var(--color-texto);
  font-family: var(--fuente-texto);
  font-size: var(--tam-texto);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
}

img { max-width: 100%; display: block; }
[hidden] { display: none !important; }

.contenedor {
  max-width: var(--ancho-maximo);
  margin: 0 auto;
  padding-left: var(--margen-lateral);
  padding-right: var(--margen-lateral);
}


/* ============================================================
   3. BARRA DE NAVEGACION (fija arriba)
   ============================================================ */
.barra {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--color-barra-fondo);
  border-bottom: 1px solid var(--color-barra-borde);
  padding-top: env(safe-area-inset-top, 0px);
}

.barra nav {
  height: var(--alto-barra);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 6vw, 40px);
}

.barra a {
  color: var(--color-barra-texto);
  text-decoration: none;
  font-size: 0.86rem;
  letter-spacing: 0.06em;
  padding: 10px 2px;          /* zona de toque comoda en movil */
  border-bottom: 1.5px solid transparent;
  transition: color .2s ease, border-color .2s ease;
}

.barra a.activo {
  color: var(--color-barra-activo);
  border-bottom-color: var(--color-barra-activo);
}


/* ============================================================
   4. CABECERA / SOBRE MI
   ============================================================ */
.cabecera {
  padding-top: clamp(48px, 14vw, 90px);
  padding-bottom: clamp(40px, 12vw, 80px);
  text-align: center;
}

.nombre {
  font-family: var(--fuente-titulo);
  font-weight: var(--grosor-titulo);
  font-size: var(--tam-titulo);
  letter-spacing: var(--espaciado-titulo);
  color: var(--color-titulo);
  line-height: 1.15;
  margin: 0;
}

.subtitulo {
  font-family: var(--fuente-titulo);
  font-size: var(--tam-subtitulo);
  color: var(--color-texto-suave);
  font-style: italic;
  margin: 14px 0 0;
}

/* Cuadro de la bio */
.bio {
  max-width: 460px;
  margin: clamp(36px, 11vw, 60px) auto 0;
  padding: clamp(20px, 6vw, 30px);
  background: var(--color-caja-fondo);
  border: var(--grosor-caja-borde) solid var(--color-caja-borde);
  border-radius: var(--caja-redondeo);
  text-align: center;
}

.bio p { margin: 0; }


/* ============================================================
   5. SEPARADORES DE PUNTOS
   ------------------------------------------------------------
   .separador            -> puntos · palabra · puntos  (Galeria)
   .separador--completo  -> puntos de lado a lado      (Contacto)
   ============================================================ */
.puntos {
  flex: 1;
  height: var(--tam-punto);
  background-image: radial-gradient(
      circle,
      var(--color-puntos) calc(var(--tam-punto) / 2),
      transparent calc(var(--tam-punto) / 2)
  );
  background-size: var(--separacion-puntos) var(--tam-punto);
  background-repeat: repeat-x;
  background-position: center;
}

.separador {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: clamp(10px, 4vw, 20px) 0 clamp(36px, 10vw, 56px);
}

.separador h2 {
  margin: 0;
  font-family: var(--fuente-titulo);
  font-weight: var(--grosor-titulo);
  font-size: clamp(1.05rem, 4.6vw, 1.35rem);
  color: var(--color-titulo);
  white-space: nowrap;
}

.separador--completo {
  margin: clamp(48px, 14vw, 80px) 0 clamp(30px, 9vw, 48px);
}

/* el separador de contacto es solo linea: el titulo queda para lectores de pantalla */
.separador--completo h2 {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}


/* ============================================================
   6. GALERIA (mosaico de filas justificadas)
   ------------------------------------------------------------
   Cada fila tiene la misma altura y cada obra conserva su
   proporcion real (sin recortar). El orden se lee de izquierda a
   derecha y de arriba abajo, igual que en el HTML.
   Cada <figure> lleva style="--r: ancho/alto" de su foto: es lo
   que reparte el ancho de la fila. Alto de fila y separacion, en
   --alto-mosaico y --hueco-mosaico.
   Cada .galeria es un grupo: sus obras llenan el ancho, pero sin
   pasar de --alto-max-obra; si sobra sitio, la fila se centra.
   ============================================================ */
.galeria {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: calc(var(--hueco-mosaico) * 1.6) var(--hueco-mosaico);
}

/* malla: hueco entre grupos con una rayuela tumbada dentro.
   La rayuela la dibuja el JS (D) a la medida del ancho. */
.malla {
  padding: var(--aire-malla) 0;
  display: flex;
  align-items: center;
}

.malla svg {
  display: block;
  width: 100%;
  overflow: visible;
}

.malla svg path {
  fill: none;
  stroke: var(--color-rayuela);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.obra {
  --r: 1;
  flex: var(--r) 1 calc(var(--r) * var(--alto-mosaico));
  max-width: calc(var(--r) * var(--alto-max-obra));
  min-width: 0;
  margin: 0;
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* marco de la obra */
.obra .marco {
  aspect-ratio: 1 / 1;   /* cuadrado solo en los huecos sin foto */
  background: var(--color-obra-fondo);
  border: var(--grosor-obra-borde) solid var(--color-obra-borde);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .2s ease;
}

/* con foto dentro, manda la proporcion real de la obra */
.obra .marco:has(img) { aspect-ratio: auto; }

.obra .marco img {
  width: 100%;
  height: auto;
  display: block;
}

.obra:hover .marco,
.obra:focus-visible .marco { opacity: .82; }

.obra:focus-visible { outline: 2px solid var(--color-titulo); outline-offset: 6px; }

/* rotulo de relleno, para huecos que todavia no tengan foto */
.obra .marco span {
  font-size: 0.8rem;
  color: var(--color-texto-suave);
  letter-spacing: 0.08em;
}

.obra figcaption {
  margin-top: 6px;
  font-family: var(--fuente-obra);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(0.95rem, 2.6vw, 1.1rem);
  line-height: 1.25;
}

.obra .anio {
  display: block;
  font-size: 0.8rem;
  color: var(--color-texto-suave);
}


/* ============================================================
   7. CONTACTO
   ============================================================ */
.contacto {
  text-align: center;
  padding-bottom: 20px;
}

.contacto ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ============================================================
   8. LIGHTBOX (ampliacion de la obra en la misma pagina)
   ============================================================ */
.lightbox {

<script>
/* ============================================================
   A. Resaltar en la barra el enlace de la seccion visible
   ============================================================ */
(function () {
  var enlaces = {};
  document.querySelectorAll('.barra a').forEach(function (a) {
    enlaces[a.dataset.enlace] = a;
  });

  var orden = ['sobre-mi', 'galeria', 'contacto'];
  var enFranja = {};          // secciones que cruzan la franja central
  var contactoVisible = false;

  function pintar() {
    var activa = contactoVisible ? 'contacto'
               : orden.filter(function (id) { return enFranja[id]; })[0];
    if (!activa) return;
    for (var k in enlaces) { enlaces[k].classList.remove('activo'); }
    if (enlaces[activa]) { enlaces[activa].classList.add('activo'); }
  }

  var observador = new IntersectionObserver(function (entradas) {
    entradas.forEach(function (e) { enFranja[e.target.id] = e.isIntersecting; });
    pintar();
  }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });

  orden.forEach(function (id) {
    var s = document.getElementById(id);
    if (s) { observador.observe(s); }
  });

  // Contacto es corto y esta al final: nunca sube hasta la franja central.
  // Se marca en cuanto se ve el 60 % de la seccion.
  var contacto = document.getElementById('contacto');
  if (contacto) {
    new IntersectionObserver(function (entradas) {
      contactoVisible = entradas[0].isIntersecting;
      pintar();
    }, { threshold: 0.6 }).observe(contacto);
  }
})();


/* ============================================================
   B. Email montado por trozos (anti-spam)
   Si cambia la direccion, cambiar estas dos variables.
   ============================================================ */
(function () {
  var usuario = 'ceciliaquignon';
  var dominio = 'gmail.com';
  var a = document.getElementById('email');
  if (!a) { return; }
  a.textContent = usuario + '@' + dominio;
  a.setAttribute('href', 'mailto:' + usuario + '@' + dominio);
})();


/* ============================================================
   B2. Ano del aviso de autoria, siempre al dia
   ============================================================ */
(function () {
  var anio = document.getElementById('anio-actual');
  if (anio) { anio.textContent = new Date().getFullYear(); }
})();


/* ============================================================
   C. Lightbox: ampliar la obra dentro de la misma pagina
   ============================================================ */
(function () {
  var caja   = document.getElementById('lightbox');
  var imagen = document.getElementById('lb-img');
  var titulo = document.getElementById('lb-titulo');
  var datos  = document.getElementById('lb-datos');
  var cerrar = document.getElementById('cerrar-lightbox');
  var ultima = null;   // obra pulsada, para devolverle el foco al cerrar

  function abrir(obra) {
    ultima = obra;
    var foto = obra.querySelector('img');

    imagen.src = obra.dataset.img || (foto ? foto.src : '');
    imagen.alt = foto ? foto.alt : '';

    titulo.textContent = obra.dataset.titulo || '';
    datos.textContent  = [obra.dataset.anio, obra.dataset.tecnica]
                           .filter(Boolean).join(' · ');
    caja.hidden = false;
    document.body.style.overflow = 'hidden';
    cerrar.focus();
  }

  function ocultar() {
    caja.hidden = true;
    imagen.removeAttribute('src');   // no dejar la foto cargada de fondo
    imagen.alt = '';
    document.body.style.overflow = '';
    if (ultima) { ultima.focus(); }
  }

  document.querySelectorAll('.obra').forEach(function (obra) {
    obra.addEventListener('click', function () { abrir(obra); });
    obra.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(obra); }
    });
  });

  cerrar.addEventListener('click', ocultar);
  caja.addEventListener('click', function (ev) { if (ev.target === caja) { ocultar(); } });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !caja.hidden) { ocultar(); }
  });
})();

/* ============================================================
   D. Rayuelas entre grupos
   En cada .malla se dibuja una rayuela tumbada y centrada: el
   semicirculo a la izquierda y luego las casillas de PATRON
   (simples y dobles). En pantallas estrechas se encoge para
   caber. Tamano en --tam-rayuela, color en --color-rayuela.
   ============================================================ */
(function () {
  var mallas = document.querySelectorAll('.malla');
  if (!mallas.length) return;
  var NS = 'http://www.w3.org/2000/svg';

  // casillas de izquierda a derecha despues del semicirculo: 1 = simple, 2 = doble
  var PATRON = [2, 1, 1, 2, 1, 2, 1, 1, 2];

  function rayuela(ancho, lado) {
    var n = PATRON.length;
    var c = Math.min(lado, (ancho - 1) / (n + 0.5));   // lado de casilla; mas pequena si no cabe
    var alto = 2 * c, medio = alto / 2;
    var x = (ancho - c * (n + 0.5)) / 2 + c / 2, d = '';   // centrada

    // semicirculo de "cielo", pegado a la primera casilla
    var h0 = PATRON[0] === 2 ? c : c / 2;
    d += 'M' + x + ' ' + (medio - h0) + 'A' + h0 + ' ' + h0 + ' 0 0 0 ' + x + ' ' + (medio + h0);
    PATRON.forEach(function (tipo) {
      var y1 = tipo === 2 ? 0.5 : medio - c / 2, y2 = tipo === 2 ? alto - 0.5 : medio + c / 2;
      d += 'M' + x + ' ' + y1 + 'H' + (x + c) + 'V' + y2 + 'H' + x + 'Z';
      if (tipo === 2) d += 'M' + x + ' ' + medio + 'H' + (x + c);
      x += c;
    });
    return { d: d, alto: alto };
  }

  function dibujar() {
    var lado = parseFloat(getComputedStyle(document.documentElement)
                          .getPropertyValue('--tam-rayuela')) || 20;
    mallas.forEach(function (m) {
      var ancho = m.clientWidth;
      if (!ancho) return;
      var r = rayuela(ancho, lado);
      var svg = m.querySelector('svg');
      if (!svg) {
        svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('aria-hidden', 'true');
        svg.appendChild(document.createElementNS(NS, 'path'));
        m.appendChild(svg);
      }
      svg.setAttribute('viewBox', '0 0 ' + ancho + ' ' + (r.alto + 1));
      svg.setAttribute('height', r.alto + 1);
      svg.firstChild.setAttribute('d', r.d);
    });
  }

  var pendiente = false;
  function pedir() {
    if (pendiente) return;
    pendiente = true;
    requestAnimationFrame(function () { pendiente = false; dibujar(); });
  }

  if ('ResizeObserver' in window) { new ResizeObserver(pedir).observe(mallas[0]); }
  window.addEventListener('resize', pedir);
  pedir();
})();
</script>
